      @font-face {
        font-family: "Basel Grotesk";
        src: url("fonts/Basel-Grotesk-Regular.woff2") format('woff2');
        font-display: swap;
        font-weight: normal;
        font-style: normal;
      }

      @font-face {
        font-family: "Basel Grotesk";
        src: url("fonts/Basel-Grotesk-Bold.woff2") format('woff2');
        font-display: swap;
        font-weight: bold;
        font-style: normal;
      }

      * {
        box-sizing: border-box;
        corner-shape: superellipse(1.5);
      }

      body {
        margin: 0;
        padding: 0;

        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-smoothing: antialiased;
        backface-visibility: hidden;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      tt {
        font-family: "Berkeley Mono", monospace;
        font-size: 14px;
        line-height: 16px;
        letter-spacing: -0.02em;
        display: inline-block;
        color: var(--accent-color);
      }

      #identity {
        display: flex;
        opacity: 1;
        flex-direction: column;
        gap: 6px;
        width: 114px;
        position: absolute;
        left: 20px;
        top: 20px;
        z-index: 3;
        pointer-events: none;
        user-select: none;
        color: #777;
        transition: opacity 0.4s ease-in-out;
        img {
          width: 136px;
          height: 55px;
          object-fit: contain;
          margin-left: -10px;
          transition: filter 0.3s;
        }
      }

      #identity:has(~ #carousel label[theme="light"] input:checked) img {
        filter: invert(0%);
      }

      #identity:has(~ #carousel label[theme="dark"] input:checked) img {
        filter: invert(100%);
      }

      #about-us {
        display: flex;
        min-height: 400px;
        padding: 20px;
        flex-direction: column;
        font-family: "Basel Grotesk", sans-serif;

        a {
          cursor: ne-resize;
        }

        h1, h2 {
          margin: 0;
          width: 440px;
          max-width: 100%;
          font-size: 22px;
          font-weight: normal;
          letter-spacing: -0.01em;
          margin-bottom: 20px;
        }

        h2 span {
          color: #999;
        }

        #signature {
          margin-top: 80px;

          tt {
            color: black;
          }
          img {
            margin-left: -4px;
          }
          table {
            border-spacing: 0;
            margin-bottom: 4px;
            td {
              text-transform: uppercase;
              vertical-align: top;
              padding: 6px 0 0 0;
              font-size: 0;
            }
            .email {
              animation: blink 1s infinite;
              &:hover {
                animation: blink 0.3s infinite;
              }
            }
          }
        }
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        40% { opacity: 0.25; }
      }

      #carousel {
        display: flex;
        align-items: flex-end;
        position: relative;
        width: 100vw;
        aspect-ratio: 16/9;
        overflow: hidden;
        user-select: none;
        padding: 0 20px;
      }

      /* ─── iPhone framing — typed runtime knobs ─────────────────────────
         These are at top level because @property is a top-level at-rule.
         They give parse-time type safety and an initial-value, so the math
         deep in the iPhone framing system below (search "iPhone framing
         system") never needs an inline sentinel fallback. */
      @property --pad-count        { syntax: '<number>'; inherits: false; initial-value: 2; }
      @property --zoom             { syntax: '<number>'; inherits: false; initial-value: 1; }
      @property --source-w         { syntax: '<number>'; inherits: false; initial-value: 99999; }
      @property --chassis-source-w { syntax: '<number>'; inherits: false; initial-value: 99999; }
      @property --chassis-w        { syntax: '<number>'; inherits: false; initial-value: 1; }
      @property --chassis-h        { syntax: '<number>'; inherits: false; initial-value: 1; }
      @property --screen-coverage    { syntax: '<number>'; inherits: false; initial-value: 1; }
      @property --dpr              { syntax: '<number>'; inherits: true;  initial-value: 2; }

      label {
        z-index: 1;
        flex-grow: 1;

        input {
          position: absolute;
          display: none;
        }
        
        .incrementor {
          position: absolute;
          width: 50%;
          top: 0;
          left: -50vw;
          bottom: 48px;
        }

        .tab {
          height: 48px;
          padding: 0 1px;
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
          cursor: pointer;
          position: relative;
          transition: opacity 0.4s ease-in-out;

          div {
            height: 4px;
            width: 100%;
            z-index: 2;
            position: relative;
            background: rgba(255, 255, 255, 0.15);
            transform-origin: bottom center;
            transition: transform 0.3s, scale 0.2s;

            &::after {
              content: "";
              position: absolute;
              left: 100%;
              right: 0;
              top: 0;
              bottom: 0;
              background: rgba(255, 255, 255, 0.9);
            }
          }
        }

        .content {
          z-index: -1;
          display: flex;
          justify-content: center;
          align-items: center;
          position: absolute;
          visibility: hidden;
          overflow: hidden;
          top: 0px;
          right: 0px;
          bottom: 0px;
          left: 200vw;
          width: 100vw;
          aspect-ratio: 16 / 9;

          .video {
            position: relative;

            img, video {
              position: relative;
              display: block;
              margin: 0;
              padding: 0;
              border: 0;
              line-height: 0;
              vertical-align: top;
              transition: opacity 0.1s ease-in-out;
              z-index: 0;
            }

            video {
              position: absolute;
              inset: 0;
              z-index: 1;
              opacity: 0;
            }
          }

          .video:not(.device) video,
          .video:not(.device) img {
            height: calc(100% + 4px);
            width: calc(100% + 4px);
            margin: -2px 0 0 -2px;
            clip-path: inset(1px);
          }

          .cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            img, video {
              object-fit: cover;
            }
          }

          .contain {
            width: 100%;
            height: 100%;
            object-fit: contain;
            img, video {
              width: 100%;
              height: 100%;
              object-fit: contain;
            }
          }

          picture {
            display: block;
            width: 100%;
            height: 100%;
            img {
              width: 100%;
              height: 100%;
            }
          }

          .device {
            width: 100%;
            height: auto;
            max-width: 92%;
            max-height: 80%;

            img, video {
              width: 100%;
              height: 100%;
              object-fit: contain;
            }

            video {
              //inset: -0.5px;
              //width: calc(100% + 1px);
              //height: calc(100% + 1px);
            }
          }

          .app {
            width: auto;
            height: 100%;
            max-width: calc((92% - 20px) / 3);
            max-height: calc(100% - 8vw);
            margin-left: 1%;
            margin-right: 1%;
            border-radius: 13.18% / 6.07%;
            corner-shape: superellipse(1.1);
            overflow: hidden;

            &:first-child {
              margin-left: 4%;
            }

            &:last-child {
              margin-right: 4%;
            }
          }

          /* ─────────────────────────────────────────────────────────────────────
             iPhone framing system

             Every iPhone slide is one <div> sitting absolutely-positioned inside
             the 16:9 clip window (.content). It carries:
               · a model class       .iphoneair / .iphone13mini — fills the
                                     chassis-variable contract.
               · a composition       .top / .bottom — centered is the default.
               · a zoom (optional)   .zoom-75 / .zoom-50 — whole phone default.
               · data-source-w       the screen content's native pixel width.

             Sharpness is enforced two ways. The JS picker degrades the *framing
             class* when the source can't support it (clean discrete transitions
             on resize). The CSS cap is the final pixel ceiling — even at the
             picker's terminal state, the phone won't render bigger than its
             source pixels.

             Variable scope:
               ─ window ─      --carousel-h --pad
               ─ axes ─        --pad-count --zoom
               ─ height ─      --ideal-h --max-h --phone-h --anchor
               ─ position ─    --pin-top --pin-bottom --pin-shift
               ─ cap inputs ─  --source-w --chassis-source-w --dpr --screen-coverage
               ─ model ─       --chassis-* --screen-* --shadows-*

             Typed knobs are declared at the top of the stylesheet via @property,
             so the math here never needs an inline sentinel fallback.
             ───────────────────────────────────────────────────────────────────── */

          /* Chassis visuals + window constants. Models fill the rest of the contract. */
          .app:where([class*="iphone"]) {
            --carousel-h: 56.25vw;   /* clip window height = 100vw × 9/16 */
            --pad: 4vw;          /* breathing room on the revealed edge */

            width: auto;
            max-height: none;
            aspect-ratio: var(--chassis-w) / var(--chassis-h);
            max-width: 92%;
            border-radius: 0;
            corner-shape: normal;
            overflow: visible;
            container-type: inline-size;
            position: relative;

            &::before {  /* long shadow — sized as a % of .app */
              content: "";
              position: absolute;
              top: 0;
              left: 0;
              width: var(--shadows-w);
              height: var(--shadows-h);
              background: var(--shadows-image) 0 0 / 100% 100% no-repeat;
              opacity: 0.8;
              pointer-events: none;
              z-index: 0;
            }
            &::after {   /* chassis bezel — transparent over the screen cutout */
              content: "";
              position: absolute;
              // opacity: 0.5;
              inset: 0;
              background: var(--chassis-image) 0 0 / 100% 100% no-repeat;
              pointer-events: none;
              z-index: 2;
            }
            & > img,
            & > video,
            & > picture {  /* screen content — fits the bezel cutout */
              position: absolute;
              top: var(--screen-inset-top);
              left: var(--screen-inset-left);
              width:  calc(100% - var(--screen-inset-left) - var(--screen-inset-right));
              height: calc(100% - var(--screen-inset-top)  - var(--screen-inset-bottom));
              object-fit: cover;
              outline: 4px solid black;
              border-radius: var(--screen-radius);
              corner-shape: superellipse(1.1);
              z-index: 1;
            }
            & > img,
            & > picture {
              box-shadow: var(--screen-shadow);
            }
          }

          /* Framing — position the phone and derive its height from the two axes.
             Defaults are centered & whole-phone; .top / .bottom / .zoom-* override. */
          .app[class*="iphone"] {
            position: absolute;
            left: 50%;
            top:    var(--pin-top);
            bottom: var(--pin-bottom);

            --pin-top: 50%;
            --pin-bottom: auto;
            --pin-shift: -50%;

            --screen-coverage: calc(1 - var(--screen-inset-left) / 100% - var(--screen-inset-right) / 100%);
            --ideal-h: calc((var(--carousel-h) - var(--pad-count) * var(--pad)) / var(--zoom));
            --max-h: calc(
              min(var(--chassis-source-w), calc(var(--source-w) / var(--screen-coverage)))
              * var(--chassis-h) / var(--chassis-w) * 1px / var(--dpr)
            );
            --phone-h: min(var(--ideal-h), var(--max-h));
            /* Pad while the phone overflows the frame; smoothly recenter when the
               cap shrinks it below frame size. Consumed by .top / .bottom. */
            --anchor: max(var(--pad), calc((var(--carousel-h) - var(--phone-h)) / 2));

            height: var(--phone-h);
            transform: translateX(-50%) translateY(var(--pin-shift));
            margin: 0;  /* beat .app:first/last-child's 4% margins */
          }

          /* Composition — centered is the default; .top / .bottom override. */
          .app[class*="iphone"].top    { --pin-top: var(--anchor);                       --pin-shift: 0; --pad-count: 1; }
          .app[class*="iphone"].bottom { --pin-top: auto; --pin-bottom: var(--anchor);   --pin-shift: 0; --pad-count: 1; }

          /* Zoom. */
          .app[class*="iphone"].zoom-75 { --zoom: 0.75; }
          .app[class*="iphone"].zoom-50 { --zoom: 0.5; }

          /* Centered (no composition) + zoom: edge-to-edge crop, no pads. */
          .app[class*="iphone"]:not(.top):not(.bottom):is(.zoom-75, .zoom-50) { --pad-count: 0; }

          .app.iphoneair {
            --chassis-image: url(./assets/bezels/iphone-air-space-black.png);
            --shadows-image: url(./assets/bezels/iphone-air-long-shadow.png);
            --chassis-w: 460;
            --chassis-h: 960;
            --chassis-source-w: 1380;   /* bezel PNG width — picker checks against this */
            --screen-inset-top: 2.475%;    /* tuned for iOS DI alignment: recording's   */
            --screen-inset-right: 4.4%;  /* DI (~recording y=63) lands at bezel's DI  */
            --screen-inset-bottom: 2.5%; /* shape (chassis y=133) within <1 px.        */
            --screen-inset-left: 4.3%;   /* L/R tightened 3 PNG px (60→57) for overlap */
            --screen-radius: 14.286% / 6.579%;
            --shadows-w: 150.217%;
            --shadows-h: 123.75%;
            --screen-shadow:
              4.348cqw 4.348cqw 10.87cqw rgba(0, 0, 0, 0.25),
              21.74cqw 21.74cqw 32.61cqw rgba(0, 0, 0, 0.17);
          }

          .app.iphone13mini {
            --chassis-image: url(./assets/bezels/iphone-13-mini-bezel.png);
            --shadows-image: url(./assets/bezels/iphone-13-mini-long-shadow.png);
            --chassis-w: 424;
            --chassis-h: 863;
            --chassis-source-w: 1272;   /* bezel PNG width — picker checks against this */
            --screen-inset-top: 2.820%;    /* screen cutout y 76–2508, x 75–1199 (asymmetric); */
            --screen-inset-right: 5.425%;  /* tightened 3 PNG px on each edge to overlap     */
            --screen-inset-bottom: 2.974%; /* the bezel cutout and mask sub-pixel gaps        */
            --screen-inset-left: 5.660%;
            --screen-radius: 11.222% / 4.641%;
            --shadows-w: 144.811%;
            --shadows-h: 121.321%;
            --screen-shadow:
              4.717cqw 4.717cqw 11.79cqw rgba(0, 0, 0, 0.25),
              23.58cqw 23.58cqw 35.38cqw rgba(0, 0, 0, 0.17);
          }

          .app.iphone16pro {
            --chassis-image: url(./assets/bezels/iphone-16-pro-black-bezel.png);
            --shadows-image: url(./assets/bezels/iphone-16-pro-long-shadows.png);
            --chassis-w: 450;
            --chassis-h: 920;
            --chassis-source-w: 1350;   /* bezel PNG width — picker checks against this */
            --screen-inset-top: 2.4%;    /* screen IS centered (2.5%/5.333%) per alpha measurement;
                                            tightened slightly to overlap the bezel cutout edge and
                                            mask sub-pixel rendering gaps at varying viewport widths */
            --screen-inset-right: 5.25%;
            --screen-inset-bottom: 2.4%;
            --screen-inset-left: 5.25%;
            --screen-radius: 14.925% / 6.865%;   /* 60pt screen corner radius */
            --shadows-w: 150.444%;
            --shadows-h: 124.456%;
            --screen-shadow:
              4.444cqw 4.444cqw 11.111cqw rgba(0, 0, 0, 0.25),
              22.222cqw 22.222cqw 33.333cqw rgba(0, 0, 0, 0.17);
          }

          .fade-out-bottom {
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 90%, rgba(0,0,0,0.5) 100%);
          }
        }

        .information {
          display: grid;
          grid-template-columns: 2fr 8fr;
          grid-gap: 8px;
          position: absolute;
          right: 20px;
          bottom: 20px;
          left: 20px;
          visibility: hidden;
          pointer-events: none;
          z-index: 3;
          transition: opacity 0.4s ease-in-out;
        }

        &[theme="light"] {
          .content {
            background: black;
          }
        }
        &[theme="dark"] {
          .content {
            background: #eee;
          }
        }

        &:has(input:checked) {
          z-index: 0;

          .information {
            visibility: visible;
          }

          .content {
            visibility: visible;
            left: 0;
          }

          .tab div::after {
            left: 0;
          }
        }

        /* Sibling content preload — brings prev/next slide into viewport so its assets fetch. */
        &:has(+ label input:checked),
        &:has(input:checked) + label {
          .content {
            left: 0;
          }
        }

        .tab:hover {
          div {
            transform: scaleY(4) !important;
          }
          & + .information {
            opacity: 1;
          }
        }

        .tab:active div {
          scale: 1 0.95;
        }

        &:has(+ label .tab:hover),
        &:has(.tab:hover) + label {
          .tab div {
            transform: scaleY(2.5);
          }
        }
      }

      body:has(.tab:hover) {
        .tab div {
          transform: scaleY(2);
        }
      }

      /* Previous-slide navigation: label before active gets left-incrementor */
      #carousel label:has(+ label > input:checked) .incrementor {
        transform: translateX(50vw);
        cursor: w-resize;
      }

      /* Left wraparound: first slide active → last slide gets left-incrementor */
      #carousel:has(> label:first-of-type > input:checked) > label:last-of-type .incrementor {
        transform: translateX(50vw);
        cursor: w-resize;
      }

      /* Next-slide navigation: label after active gets right-incrementor */
      #carousel label:has(> input:checked) + label .incrementor {
        transform: translateX(100vw);
        cursor: e-resize;
      }

      /* Right wraparound: last slide active → first slide gets right-incrementor */
      #carousel:has(> label:last-of-type > input:checked) > label:first-of-type .incrementor {
        transform: translateX(100vw);
        cursor: e-resize;
      }

      label[theme="dark"]:has(> input:checked),
      label[theme="dark"]:has(> input:checked) ~ label,
      label:has(~ label[theme="dark"] input:checked) {
        .tab div {
          background: rgba(119, 119, 119, 0.15);

          &::after {
            background: rgba(119, 119, 119, 0.9);
          }
        }
      }

      body:has(#carousel label[theme="light"] input:checked) {
        --accent-color: rgba(255, 255, 255, 0.6);
      }

      body:has(#carousel label[theme="dark"] input:checked) {
        --accent-color: rgba(0, 0, 0, 0.6);
      }

      @media (max-width: 1080px) {
        label.desktop-only {
          display: none;
        }

        #carousel label[theme="light"] {
          --accent-color: rgba(255, 255, 255, 0.6);
        }

        #carousel label[theme="dark"] {
          --accent-color: rgba(0, 0, 0, 0.6);
        }

        #about-us h1, #about-us h2 {
          font-size: 19px;
        }

        #carousel {
          overflow: scroll;
          flex-direction: column;
          background: black;
          height: auto;
          aspect-ratio: auto;
          padding: 0;

          label {
            position: relative;

            .content {
              position: static;
              display: flex;
              justify-content: center;
              align-items: center;
              visibility: visible;
              opacity: 1;
              overflow: hidden;
              aspect-ratio: 4/5;

              video, img {
                display: block;
              }

              .device:not(.app) {
                width: 100% !important;
                height: 100% !important;
                max-width: 92% !important;
                max-height: 100% !important;
                aspect-ratio: unset !important;
              }

              .app {
                width: 100%;
                height: auto;

                &:first-child {
                  margin-left: 4%;
                }

                &:last-child {
                  margin-right: 4%;
                }
              }

              /* Mobile uses a 4:5 frame, not the desktop 16:9 — the phone is a
                 flex item that fills it, so neutralise the desktop absolute
                 framing. The frame classes only set custom properties, so plain
                 source order overrides them here. All apps share one composition
                 on mobile: "top-75" — pinned to the top with one pad of
                 breathing room, zoomed in so the screen crops off the bottom. */
              .app[class*="iphone"] {
                position: relative;
                inset: auto;
                width: auto;
                height: calc((100% - var(--pad)) / 0.75);
                max-width: 92%;
                margin: calc(2 * var(--pad)) 0 0 0;
                transform: none;
                align-self: flex-start;
              }
            }

            .information {
              visibility: visible;
              display: grid;
              grid-template-columns: 1fr;
            }

            .tab,
            .incrementor,
            .title {
              display: none;
            }
          }
        }
      }
    </style>

    <script>
      const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
      const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
      const assetPrefix = "./content/compressed/";

      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }

      document.addEventListener("DOMContentLoaded", () => {
        const radioInputs = document.querySelectorAll('input[type="radio"]');
        const videos = document.querySelectorAll('.video');
        const p = performance.getEntriesByName(window.location)[0];
        const identity = document.getElementById('identity');
        const carousel = document.getElementById('carousel');
        const tabs = document.querySelectorAll('.tab');
        const informationElements = document.querySelectorAll('.information');

        let cycleInterval;
        let inactivityTimeout;
        let pendingTimeouts = new Map();
        let pendingFades = new Map();

        const videoObserver = new IntersectionObserver((entries) => {
          entries.forEach(({ isIntersecting, target }) => {
            const img = target.querySelector('img');
            const existingVideo = target.querySelector('video');

            if (isIntersecting) {
              if (existingVideo) return;

              clearTimeout(pendingTimeouts.get(target));
              pendingTimeouts.delete(target);

              const loadVideo = () => {
                if (target.querySelector('video')) return;

                const video = document.createElement('video');

                Object.assign(video, {
                  src: getVideoSource(video, target.dataset),
                  muted: true,
                  autoplay: true,
                  loop: true,
                  playsInline: true,
                });

                video.addEventListener('playing', () => {
                  video.style.opacity = '1';
                  if (window.innerWidth > 1080 && !target.matches('.app[class*="iphone"]')) {
                    const fadeTimer = setTimeout(() => img.style.opacity = '0', 300);
                    pendingFades.set(target, fadeTimer);
                  }
                });

                target.appendChild(video);
              };

              if (window.innerWidth <= 1080) {
                const timeout = setTimeout(loadVideo, 200);
                pendingTimeouts.set(target, timeout);
              } else {
                loadVideo();
              }
            } else {
              clearTimeout(pendingTimeouts.get(target));
              pendingTimeouts.delete(target);
              clearTimeout(pendingFades.get(target));
              pendingFades.delete(target);

              if (existingVideo) {
                setTimeout(() => {
                  existingVideo.pause();
                  existingVideo.removeAttribute('src');
                  existingVideo.load();
                  existingVideo.remove();
                }, 300);

                existingVideo.style.opacity = '0';
                if (window.innerWidth > 1080) {
                  img.style.opacity = '1';
                }
              }
            }
          });
        }, { threshold: 0.5 });


        function selectWidth(isMobile) {
          const px = window.innerWidth * (window.devicePixelRatio || 1);
          if (isMobile) {
            if (px <= 1080) return '1080w';
            if (px <= 1290) return '1290w';
            if (px <= 1800) return '1800w';
            return '2160w';
          } else {
            if (px <= 1920) return '1920w';
            if (px <= 2560) return '2560w';
            return '3840w';
          }
        }

        function getVideoSource(video, dataset) {
          const isMobile = window.innerWidth <= 1080;
          const src = isMobile && dataset.srcMobile ? dataset.srcMobile : dataset.src;

          let subfolder, width;
          if (dataset.sourceW) {
            subfolder = 'device';
            width = dataset.sourceW + 'w';
          } else {
            subfolder = isMobile ? 'mobile' : 'desktop';
            width = selectWidth(isMobile);
          }

          const formats = {
            "video/mp4; codecs=hvc1": `-${width}-h265.mp4`,
            "video/webm; codecs=vp9": `-${width}.webm`,
            "video/mp4; codecs=avc1": `-${width}-h264.mp4`
          };

          if (isMac && isSafari) {
            delete formats["video/webm; codecs=vp9"]
          }

          const format = Object.keys(formats).find(format => video.canPlayType(format) !== '');

          // data-src is `<chassis>/<slug>` (e.g. "air/ios_apple_pay"); files
          // are named by basename only, not the chassis-prefixed path.
          const basename = src.split('/').pop();
          return `./references/content/${src}/${subfolder}/${basename}${formats[format]}`;
        }

        function selectProject(input) {
          input.checked = true;
          input.dispatchEvent(new Event('change', { bubbles: true, cancelable: true }));
        }

        function handleKeydown(e) {
          if (e.key === "ArrowDown" || e.key === "ArrowUp") e.preventDefault();
          if (window.innerWidth <= 1080) return;
          let index = Array.from(radioInputs).findIndex((radio) => radio.checked);
          if (index === -1) index = 0;
          if (e.key === "ArrowRight" || e.key === "l" || e.key === "d") {
            index = (index + 1) % radioInputs.length;
          } else if (e.key === "ArrowLeft" || e.key === "h" || e.key === "a") {
            index = (index - 1 + radioInputs.length) % radioInputs.length;
          } else {
            return;
          }
          selectProject(radioInputs[index])
        }

        function init() {
          radioInputs.forEach((input, index) => {
            if (window.innerWidth <= 1080) {
              input.disabled = true;
              if (index === 0) selectProject(input);
            } else {
              input.disabled = false;
            }
          });
        }

        window.addEventListener("resize", init);
        window.addEventListener("keydown", handleKeydown);

        function setupVideoElement(video) {
          const isMobile = window.innerWidth <= 1080;
          const src = isMobile && video.dataset.srcMobile ? video.dataset.srcMobile : video.dataset.src;

          let subfolder, width;
          if (video.dataset.sourceW) {
            subfolder = 'device';
            width = video.dataset.sourceW + 'w';
            if (!video.matches('.app[class*="iphone"]')) {
              video.style.aspectRatio = `${video.dataset.sourceW} / ${video.dataset.sourceH}`;
              video.style.maxWidth = isMobile ? '' : `min(${parseInt(video.dataset.sourceW) / 2}px, 92%)`;
            }
          } else {
            subfolder = isMobile ? 'mobile' : 'desktop';
            width = selectWidth(isMobile);
          }

          const img = video.querySelector('img');
          const basename = src.split('/').pop();
          img.src = video.dataset.poster || `./references/content/${src}/${subfolder}/${basename}-${width}-poster.webp`;
          img.alt = src;
        }

        videos.forEach(video => {
          setupVideoElement(video);
          videoObserver.observe(video);
        });

        // ─── iPhone framing picker ────────────────────────────────────────────
        // CSS owns the framing math AND the sharpness cap (see --ideal-h, --max-h,
        // --phone-h, --anchor in the iPhone framing system above). JS does only
        // the one thing CSS can't: notice when a slide's authored framing would
        // render the chassis or screen content past their native source pixels
        // and swap to a less-zoomed framing class — so the transition on resize
        // is clean and discrete, instead of the phone silently shrinking.
        {
          const slides = document.querySelectorAll('.app[class*="iphone"]');
          if (slides.length > 0) {
            // The two window constants live in CSS (--carousel-h, --pad). Read once.
            const probe = getComputedStyle(slides[0]);
            const CAROUSEL_HEIGHT_VW = parseFloat(probe.getPropertyValue('--carousel-h'));
            const EDGE_PAD_VW    = parseFloat(probe.getPropertyValue('--pad'));

            // Snapshot each slide's authored classes — the "intent" we restore
            // before each pick — and mirror data-source-w to a CSS variable so
            // the CSS sharpness cap can use it.
            const authoredClasses = new WeakMap();
            for (const slide of slides) {
              const sourceW = parseInt(slide.dataset.sourceW);
              if (sourceW) slide.style.setProperty('--source-w', sourceW);
              authoredClasses.set(slide, slide.className);
            }

            const pickFraming = () => {
              const dpr = devicePixelRatio;
              const viewportWidth = innerWidth;
              document.documentElement.style.setProperty('--dpr', dpr);

              for (const slide of slides) {
                // Restore the slide to its authored framing so each pick
                // degrades fresh from the original classes.
                slide.className = authoredClasses.get(slide);
                const sourceW = parseInt(slide.dataset.sourceW);
                if (!sourceW) continue;

                // Degrade the framing one rung at a time until both the
                // screen content and the chassis bezel fit within their
                // source pixels at this viewport × DPR.
                while (true) {
                  // 1. Compute what the current classes would render. All
                  //    inputs come straight from CSS — single source of truth.
                  const css = getComputedStyle(slide);
                  const aspect         = parseFloat(css.getPropertyValue('--chassis-w'))
                                       / parseFloat(css.getPropertyValue('--chassis-h'));
                  const chassisSourceW = parseFloat(css.getPropertyValue('--chassis-source-w'));
                  const screenCoverage   = parseFloat(css.getPropertyValue('--screen-coverage'));
                  const padCount       = parseFloat(css.getPropertyValue('--pad-count'));
                  const zoom           = parseFloat(css.getPropertyValue('--zoom'));
                  const phoneHeight    = (viewportWidth * (CAROUSEL_HEIGHT_VW - padCount * EDGE_PAD_VW) / 100) / zoom;
                  const phoneWidth     = phoneHeight * aspect;

                  // 2. If both source budgets are satisfied, this slide is done.
                  const screenFits  = phoneWidth * screenCoverage * dpr <= sourceW;
                  const chassisFits = phoneWidth * dpr <= chassisSourceW;
                  if (screenFits && chassisFits) break;

                  // 3. Otherwise drop one rung off the framing chain and re-evaluate.
                  //      zoom-50              → zoom-75
                  //      zoom-75              → strip zoom AND composition (= terminal)
                  //      top|bottom, no zoom  → strip composition          (= terminal)
                  const c = slide.classList;
                  if (c.replace('zoom-50', 'zoom-75'))           continue;
                  if (c.contains('zoom-75'))                     { c.remove('zoom-75', 'top', 'bottom'); continue; }
                  if (c.contains('top') || c.contains('bottom')) { c.remove('top', 'bottom'); continue; }
                  break;  // already at terminal — nothing left to drop
                }
              }
            };

            pickFraming();
            addEventListener('resize', pickFraming);
          }
        }

        window.matchMedia('(max-width: 1080px)').addEventListener('change', () => {
          document.querySelectorAll('.video').forEach(setupVideoElement);
          document.querySelectorAll('.video video').forEach(video => {
            const newSrc = getVideoSource(video, video.parentElement.dataset);
            if (new URL(video.src).pathname !== new URL(newSrc, location.href).pathname) {
              video.src = newSrc;
              video.load();
              video.play().catch(() => {});
            }
          });
        });

        init();
        document.body.tabIndex = -1;
        document.body.focus();

        console.log(`This website was written in ${document.documentElement.outerHTML.split("\n").length} lines of native browser code in a single HTML file. It was delivered to you in ${Math.round(p.responseEnd - p.requestStart)}ms from Github's CDN.`)
        console.log(`If you're a developer looking to work on some interesting products and projects, please send your portfolio or github profile to office@otk.studio.`)
        console.log(isSafari ? `Designed & engineered by OTK Studio` : `\n\n   ░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░  \n   ░▒▓██████▓▒░░░▒▓█████████▓▒░▒▓█▓▒░░░▒▓█▓▒░░ \n ░▒▓█▓▒░░░░▒▓█▓▒░░░░░▒▓█▓▒░░░░░▒▓█▓▒░░▒▓█▓▒░░ \n░▒▓█▓▒░░░░░░▒▓█▓▒░░░░▒▓█▓▒░░░░░▒▓█▓▒░▒▓█▓▒░░  \n░▒▓█▓▒░░░░░░▒▓█▓▒░░░░▒▓█▓▒░░░░░▒▓██████▓▒░░░  \n░▒▓█▓▒░░░░░░▒▓█▓▒░░░░▒▓█▓▒░░░░░▒▓█▓▒░▒▓█▓▒░░  \n ░▒▓█▓▒░░░░▒▓█▓▒░░░░░▒▓█▓▒░░░░░▒▓█▓▒░░▒▓█▓▒░░ \n   ░▒▓██████▓▒░░░░░░░▒▓█▓▒░░░░░▒▓█▓▒░░░▒▓█▓▒░░ \n   ░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░  \n\n      Designed & engineered by OTK Studio \n\n`);
      })
